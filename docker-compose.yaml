version: "3.8"
services:
  next:
    build:
      context: ./frontend/apps/next
      dockerfile: ./Dockerfile
      target: dev-server
    env_file:
      - ./web/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
      - NEXT_PRIVATE_DISABLE_TURBOPACK=1
    ports:
      - "3030:3030"
    volumes:
      - ./frontend/apps/next:/web
      - next-node-modules:/web/node_modules
    depends_on:
      - nest
    restart: unless-stopped
    networks:
      - webzap-twitter-network

  db:
    image: postgres:16.9
    env_file:
      - ./db/.env
    ports:
      - "10002:5432"
    volumes:
      - webzap-twitter-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - webzap-twitter-network
  nest:
    build:
      context: ./backend/apps/nest
      dockerfile: ./Dockerfile
    depends_on:
      - db
    env_file:
      - ./api/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backend/apps/nest:/web
      - nest-node-modules:/web/node_modules
    restart: unless-stopped
    networks:
      - webzap-twitter-network

volumes:
  webzap-twitter-volume:
  next-node-modules:
  nest-node-modules:

networks:
  webzap-twitter-network:
    driver: bridge
